name: Windows checks and installers
on:
  push:
    branches: [main]
    tags: ['v*']
    paths:
      - 'src/**'
      - 'src-tauri/**'
      - 'tests/**'
      - 'scripts/licenses.mjs'
      - 'package*.json'
      - 'tsconfig.json'
      - 'vite.config.ts'
      - 'LICENSE'
      - 'THIRD_PARTY_LICENSES.txt'
      - '.github/workflows/windows.yml'
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: windows-${{ github.ref }}
  cancel-in-progress: true
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: npm ci
      - run: npm test
      - run: node --test website/site.test.mjs
      - run: npm run build
      - run: cargo test --locked --manifest-path src-tauri/Cargo.toml
      - run: npm run licenses
      - name: Build actual Windows bundles
        run: npm run tauri -- build --bundles nsis,msi
      - name: Collect installers and SHA-256
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force release-assets | Out-Null
          $installers = Get-ChildItem src-tauri/target/release/bundle -Recurse -File | Where-Object { $_.Extension -in '.exe', '.msi' }
          if ($installers.Count -lt 2) { throw 'Expected NSIS and MSI installers were not built' }
          $installers | Copy-Item -Destination release-assets
          Get-ChildItem release-assets -File | Sort-Object Name | ForEach-Object { '{0}  {1}' -f (Get-FileHash -LiteralPath $_.FullName -Algorithm SHA256).Hash.ToLowerInvariant(), $_.Name } | Set-Content release-assets/SHA256SUMS.txt -Encoding utf8
      - uses: actions/upload-artifact@v4
        with:
          name: VEXORYN-Windows-x64
          path: release-assets/*
          if-no-files-found: error
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: windows
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: VEXORYN-Windows-x64
          path: release-assets
      - name: Publish draft for review
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            echo "An existing release is preserved. Review the Windows build artifacts separately."
          else
            gh release create "$RELEASE_TAG" release-assets/* --draft --title "VEXORYN $RELEASE_TAG" --generate-notes
          fi
