[package]
name = "vexoryn"
version = "0.1.0"
description = "VEXORYN local console suite"
authors = ["VEXORYN"]
license = "MIT"
edition = "2021"

[lib]
name = "vexoryn_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"

[profile.release]
strip = true
panic = "abort"

